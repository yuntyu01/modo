name: modo closed test checks
on:
  workflow_dispatch:
  pull_request:
    paths: ["server/**", "app/**", "Dockerfile", "deploy/**", ".github/workflows/closed-test-checks.yml"]
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: modo_test
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: modo_policy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U modo_test -d modo_policy_test"
          --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client-17
      - run: go test ./... -count=1
        working-directory: server
        env:
          TEST_DATABASE_URL: postgres://modo_test:isolated-test-only@127.0.0.1:5432/modo_policy_test?sslmode=disable
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: app
      - run: npm run typecheck && npm run lint && npm test -- --runInBand
        working-directory: app
