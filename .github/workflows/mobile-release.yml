# 모바일 비공개 테스트 자동 배포: main에 앱(app/) 변경이 올라오면
#   1. checks  타입·린트·테스트
#   2. android 기존 업로드 키(비밀값 MODO_UPLOAD_*)로 AAB를 빌드 → Google Play 비공개 테스트(트랙 alpha)에 출시
#              버전 코드는 Play에 있는 가장 큰 값 + 1. PLAY_SERVICE_ACCOUNT_JSON이 없으면 AAB만 만들어 아티팩트로 남긴다
#   3. ios     저장소 변수 IOS_RELEASE=true일 때만: EAS에서 빌드 → TestFlight 자동 제출(EXPO_TOKEN 필요)
# 처음 한 번 하는 설정은 README '모바일 자동 배포'. 커밋 메시지에 [skip ci]를 넣으면 이 푸시는 돌지 않는다.
name: Mobile closed testing

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '!app/**/*.md'
      - '.github/workflows/mobile-release.yml'
      - '.github/scripts/play_release.py'
      - '.github/scripts/test_play_release.py'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/mobile-release.yml'
      - '.github/scripts/*.py'
  workflow_dispatch:

permissions:
  contents: read

# 연달아 푸시하면 앞의 것은 멈추고 마지막 것만 올린다(테스터에게는 최신 하나면 된다)
concurrency:
  group: mobile-release-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      # lock 파일이 npm 11 형식(PR #1의 빌드와 같은 버전)
      - run: npm install --global npm@11.17.0 --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Test
        run: npx jest --ci

  publisher-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'google-api-python-client>=2,<3' 'google-auth>=2,<3'
      - run: python .github/scripts/test_play_release.py

  android:
    needs: [checks, publisher-checks]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # 키 자체는 쓰는 단계에만 넘긴다(잡 전체에 두면 npm ci 설치 스크립트·gradle 빌드도 읽을 수 있다). 여기는 있는지만
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --global npm@11.17.0 --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: app
      - run: python -m pip install --quiet 'google-api-python-client>=2,<3' 'google-auth>=2,<3'
        if: env.HAS_PLAY == 'true'

      - name: Version code
        shell: bash
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            code=$(python .github/scripts/play_release.py next-version-code)
          else
            # Play를 읽을 수 없으면 실행 번호로(Play에 이미 1이 있어 1을 더한다)
            code=$(( GITHUB_RUN_NUMBER + 1 ))
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON이 없어 Play에 올리지 않고 AAB만 만듭니다(버전 코드 $code)."
          fi
          # GITHUB_ENV는 다음 단계부터 보인다. 이 단계에서는 직접 넘긴다
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          VERSION_CODE=$code node -e "const n=Number(process.env.VERSION_CODE);if(!Number.isInteger(n)||n<2)throw new Error('bad versionCode '+process.env.VERSION_CODE);const f='app/app.json',fs=require('fs'),j=JSON.parse(fs.readFileSync(f,'utf8'));j.expo.android.versionCode=n;fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          echo "versionCode $code (version $(node -p "require('./app/app.json').expo.version"))" >> "$GITHUB_STEP_SUMMARY"

      - run: |
          node -e "if(!/^[a-f0-9]{32}$/.test(process.env.MODO_KAKAO_NATIVE_APP_KEY || '')) throw new Error('MODO_KAKAO_NATIVE_APP_KEY is required for the Kakao Talk release')"
          npx expo prebuild --platform android --no-install
        working-directory: app
        env:
          CI: '1'
          MODO_KAKAO_NATIVE_APP_KEY: ${{ secrets.MODO_KAKAO_NATIVE_APP_KEY }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore upload key
        shell: bash
        env:
          MODO_KEY_B64: ${{ secrets.MODO_UPLOAD_KEYSTORE_B64 }}
        run: |
          umask 077
          printf '%s' "$MODO_KEY_B64" | base64 --decode > "$RUNNER_TEMP/modo-upload.jks"

      # 기기 범위는 버전 1(PR #1 build-android.yml)과 같다
      - run: ./gradlew :app:bundleRelease --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64
        working-directory: app/android
        env:
          MODO_UPLOAD_KEYSTORE: ${{ runner.temp }}/modo-upload.jks
          MODO_UPLOAD_STORE_PASSWORD: ${{ secrets.MODO_UPLOAD_STORE_PASSWORD }}
          MODO_UPLOAD_KEY_PASSWORD: ${{ secrets.MODO_UPLOAD_KEY_PASSWORD }}
          MODO_UPLOAD_KEY_ALIAS: ${{ secrets.MODO_UPLOAD_KEY_ALIAS }}

      - name: Remove upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/modo-upload.jks"

      - name: Release to Google Play closed testing
        if: github.ref == 'refs/heads/main' && env.HAS_PLAY == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python .github/scripts/play_release.py upload app/android/app/build/outputs/bundle/release/app-release.aab alpha

      # Play upload reads the local AAB directly. Actions archive quota must not block release.
      - name: Archive AAB
        id: archive
        if: always() && hashFiles('app/android/app/build/outputs/bundle/release/app-release.aab') != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: modo-android-${{ env.VERSION_CODE }}
          path: app/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 3
          if-no-files-found: error

      - name: Report archive failure
        if: always() && steps.archive.outcome == 'failure'
        run: echo '::warning::AAB archive upload failed. Check the separate Google Play release step for submission status; archive storage is not required for Play upload.'

  ios:
    needs: checks
    # Apple Developer Program 가입·EAS 설정 뒤 저장소 변수 IOS_RELEASE=true로 켠다(README)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.IOS_RELEASE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm install --global npm@11.17.0 --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      # 빌드는 EAS 서버에서, 끝나면 TestFlight로 자동 제출(이 작업은 맡기고 바로 끝난다)
      - run: eas build --platform ios --profile production --non-interactive --no-wait --auto-submit
