name: Store flight lookup
on:
  push:
    branches: [codex/store-flight-lookup]
    paths: ['.github/workflows/store-flight-lookup.yml']
permissions:
  contents: read
jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - name: Read flight IDs
        env:
          TENANT: ${{ secrets.STORE_TENANT_ID }}
          CLIENT: ${{ secrets.STORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          try:
              tenant = os.environ['TENANT']
              body = urllib.parse.urlencode({'grant_type':'client_credentials','client_id':os.environ['CLIENT'],'client_secret':os.environ['CLIENT_SECRET'],'resource':'https://manage.devcenter.microsoft.com'}).encode()
              with urllib.request.urlopen('https://login.microsoftonline.com/' + tenant + '/oauth2/token', body) as response:
                  token = json.load(response)['access_token']
              req = urllib.request.Request('https://manage.devcenter.microsoft.com/v1.0/my/applications/9P8SSJ8GBB1X/listflights', headers={'Authorization':'Bearer ' + token})
              with urllib.request.urlopen(req) as response:
                  data = json.load(response)
              for flight in data.get('value', []):
                  print('FLIGHT:', flight['friendlyName'], flight['flightId'])
          except Exception as error:
              print('Flight lookup failed:', type(error).__name__, getattr(error, 'code', ''))
              raise SystemExit(1)
          PY
