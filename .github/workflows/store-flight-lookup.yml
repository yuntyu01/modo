name: Diagnose Store submission status
on:
  push:
    branches: [codex/store-flight-lookup]
    paths: ['.github/workflows/store-flight-lookup.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read status without changing submissions
        env:
          TENANT: ${{ secrets.STORE_TENANT_ID }}
          CLIENT: ${{ secrets.STORE_CLIENT_ID }}
          SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
          FLIGHT: ${{ vars.MODO_STORE_FLIGHT_ID }}
          PRODUCT: ${{ vars.MODO_STORE_PRODUCT_ID }}
        run: |
          python - <<'PY'
          import json,os,urllib.parse,urllib.request,urllib.error
          data=urllib.parse.urlencode({'grant_type':'client_credentials','client_id':os.environ['CLIENT'],'client_secret':os.environ['SECRET'],'resource':'https://manage.devcenter.microsoft.com'}).encode()
          token=json.load(urllib.request.urlopen('https://login.microsoftonline.com/'+os.environ['TENANT']+'/oauth2/token',data))['access_token']
          base='https://manage.devcenter.microsoft.com/v1.0/my/applications/'+os.environ['PRODUCT']+'/flights/'+os.environ['FLIGHT']
          def read(label,url):
              try:
                  req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token})
                  obj=json.load(urllib.request.urlopen(req,timeout=60))
                  print(label,'OK','status=',obj.get('status'),'pending=',(obj.get('pendingFlightSubmission') or {}).get('id'),'published=',(obj.get('lastPublishedFlightSubmission') or {}).get('id'))
                  return obj
              except urllib.error.HTTPError as e:
                  try:
                      body=json.load(e)
                      print(label,'HTTP',e.code,'code=',body.get('code'),'message=',str(body.get('message'))[:300])
                  except Exception:
                      print(label,'HTTP',e.code)
          f=read('FLIGHT',base)
          pending=(f.get('pendingFlightSubmission') or {}).get('id') if f else None
          if pending:
              read('SUBMISSION',base+'/submissions/'+pending)
              read('STATUS',base+'/submissions/'+pending+'/status')
          PY

# Check status after cancellation
