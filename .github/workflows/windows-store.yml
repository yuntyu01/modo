# Microsoft Store 자동 배포: master에 데스크톱(desktop/)·앱(app/) 변경이 올라오면
#   1. checks  앱 타입·린트, 데스크톱 단위 테스트
#   2. package Store용 APPX를 만든다(npm run dist:store). 패키지 신원은 Partner Center의 값(저장소 변수 MODO_STORE_*)
#              버전은 1.0.<실행 번호>: Store는 올릴 때마다 더 큰 버전을 요구한다(끝 자리는 0)
#   3. submit  Microsoft Store Developer CLI(msstore)로 Partner Center에 제출한다.
#              비공개 패키지 플라이트 ID가 있을 때만 제출한다(일반 공개 제출은 하지 않는다).
# 비밀값·변수가 없으면 그 단계는 건너뛰고(경고만) 만든 패키지는 아티팩트로 남긴다.
# 처음 한 번 하는 설정은 README 'Microsoft Store 자동 배포'. 커밋 메시지에 [skip ci]를 넣으면 이 푸시는 돌지 않는다.
name: Windows Store

on:
  push:
    branches: [master]
    paths:
      - 'desktop/**'
      - 'app/**'
      - '!app/**/*.md'
      - '!desktop/**/*.md'
      - '.github/workflows/windows-store.yml'
  # PR에서는 패키지까지만 만들어 본다(제출하지 않는다)
  pull_request:
    branches: [master]
    paths:
      - 'desktop/**'
      - 'app/**'
      - '.github/workflows/windows-store.yml'
  workflow_dispatch:

permissions:
  contents: read

# 연달아 푸시하면 앞의 것은 멈추고 마지막 것만 올린다
concurrency:
  group: windows-store-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: true

jobs:
  store:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      MODO_STORE_IDENTITY: ${{ vars.MODO_STORE_IDENTITY }}
      MODO_STORE_PUBLISHER: ${{ vars.MODO_STORE_PUBLISHER }}
      MODO_STORE_PUBLISHER_NAME: ${{ vars.MODO_STORE_PUBLISHER_NAME }}
      MODO_STORE_PRODUCT_ID: ${{ vars.MODO_STORE_PRODUCT_ID }}
      MODO_STORE_FLIGHT_ID: ${{ vars.MODO_STORE_FLIGHT_ID }}
      HAS_STORE_API: ${{ secrets.STORE_CLIENT_SECRET != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            desktop/package-lock.json

      - run: npm ci --no-audit --no-fund
        working-directory: app
      - run: npm ci --no-audit --no-fund
        working-directory: desktop
      - run: node node_modules/electron/install.js
        working-directory: desktop

      - name: Checks
        shell: pwsh
        run: |
          Push-Location app
          npm run typecheck; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run lint; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Pop-Location
          Push-Location desktop
          npm run test:unit; if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # Store는 올릴 때마다 더 큰 버전(Major.Minor.Build.0)을 요구한다: package.json의 주·부 버전 + 실행 번호
      - name: Version
        id: version
        shell: pwsh
        working-directory: desktop
        run: |
          $base = (Get-Content package.json -Raw | ConvertFrom-Json).version.Split('.')
          $patch = [int]$base[2] + [int]'${{ github.run_number }}'
          $v = "$($base[0]).$($base[1]).$patch"
          npm version $v --no-git-tag-version --allow-same-version | Out-Null
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Store package version $v.0"

      - name: Package (APPX)
        id: package
        shell: pwsh
        working-directory: desktop
        run: |
          if (-not $env:MODO_STORE_IDENTITY -or -not $env:MODO_STORE_PUBLISHER -or -not $env:MODO_STORE_PUBLISHER_NAME) {
            Write-Host "::warning::저장소 변수 MODO_STORE_IDENTITY·MODO_STORE_PUBLISHER·MODO_STORE_PUBLISHER_NAME이 없어 Store 패키지를 만들지 않았어요(README 'Microsoft Store 자동 배포')."
            npm run dist:win; if ($LASTEXITCODE) { exit $LASTEXITCODE }
            "file=" >> $env:GITHUB_OUTPUT
            exit 0
          }
          npm run dist:store; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $file = Get-ChildItem dist -Filter *.appx | Select-Object -First 1
          if (-not $file) { Write-Error "dist에 .appx가 없어요"; exit 1 }
          "file=$($file.FullName)" >> $env:GITHUB_OUTPUT

      - name: Install msstore CLI
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && steps.package.outputs.file != '' && env.HAS_STORE_API == 'true' && env.MODO_STORE_PRODUCT_ID == '9P8SSJ8GBB1X' && env.MODO_STORE_FLIGHT_ID != ''
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Submit to Partner Center
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && steps.package.outputs.file != ''
        shell: pwsh
        env:
          STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
          STORE_SELLER_ID: ${{ secrets.STORE_SELLER_ID }}
          STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
          PACKAGE: ${{ steps.package.outputs.file }}
        run: |
          if ($env:HAS_STORE_API -ne 'true' -or $env:MODO_STORE_PRODUCT_ID -ne '9P8SSJ8GBB1X' -or -not $env:MODO_STORE_FLIGHT_ID) {
            Write-Host "::warning::modo 제품 ID·API 비밀값·비공개 플라이트 ID가 모두 있어야 자동 제출합니다. 일반 공개 제출은 하지 않았어요. 패키지는 아티팩트에 있어요."
            exit 0
          }
          msstore reconfigure --tenantId $env:STORE_TENANT_ID --sellerId $env:STORE_SELLER_ID --clientId $env:STORE_CLIENT_ID --clientSecret $env:STORE_CLIENT_SECRET
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $cli = @('publish', '.', '-i', $env:PACKAGE, '-id', $env:MODO_STORE_PRODUCT_ID, '-f', $env:MODO_STORE_FLIGHT_ID)
          msstore @cli
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # Store submission uses the local package, independently of Actions archive capacity.
      - name: Archive Windows package
        id: archive
        if: always() && github.event_name != 'pull_request' && (hashFiles('desktop/dist/*.appx') != '' || hashFiles('desktop/dist/*.zip') != '')
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: modo-windows-${{ steps.version.outputs.version }}
          path: |
            desktop/dist/*.appx
            desktop/dist/*.zip
          if-no-files-found: error
          retention-days: 3

      - name: Report archive failure
        if: always() && steps.archive.outcome == 'failure'
        shell: pwsh
        run: Write-Host '::warning::Windows archive upload failed. Check the separate Store submission step for status; archive storage is not required for Store submission.'
