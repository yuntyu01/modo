# 프로젝트 이름을 고정해 볼륨 이름(modo_pgdata)이 폴더 이름에 따라 바뀌지 않게 한다.
name: modo

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: modo
      POSTGRES_PASSWORD: modo
      POSTGRES_DB: modo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modo"]
      interval: 2s
      retries: 15

  server:
    build: ./server
    environment:
      DATABASE_URL: postgres://modo:modo@db:5432/modo?sslmode=disable
      # 카카오 로그인(선택). 카카오 개발자 콘솔의 REST API 키·Client Secret과 이 서버의 외부 주소.
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:8080}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
